# Render YAML deployment manifest for the deploy branch.

services:
  - type: web
    name: preppilot-backend
    env: docker
    repo: https://github.com/tejaswitha3/PrepPilot
    branch: deploy
    rootDir: preppilot-backend
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: FLASK_ENV
        value: production
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: preppilot-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: preppilot-db
    plan: free
    region: oregon

# Set CORS_ORIGINS to the deployed frontend origin in the Render dashboard.
