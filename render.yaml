# Render YAML deployment manifest (edit OWNER/REPO and placeholders before use)

services:
  - type: web
    name: preppilot-backend
    env: docker
    repo: https://github.com/OWNER/REPO
    branch: main
    dockerfilePath: preppilot-backend/Dockerfile
    plan: free
    buildCommand: ""
    envVars:
      - key: FLASK_ENV
        value: production
      - key: JWT_SECRET_KEY
        value: $JWT_SECRET_KEY
      - key: SECRET_KEY
        value: $SECRET_KEY
      - key: OPENAI_API_KEY
        value: $OPENAI_API_KEY
      - key: CORS_ORIGINS
        value: https://your-frontend-url.com

databases:
  - name: preppilot-db
    plan: free
    region: oregon

# To link the DATABASE_URL env var to the created database in Render,
# after creating the service in the Render dashboard, set DATABASE_URL
# to the connection string from the created `preppilot-db` service.
