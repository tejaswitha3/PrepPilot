name: Frontend Tests

on:
  push:
    branches: [ main, deploy ]
  pull_request:
    branches: [ main, deploy ]

jobs:
  test-frontend:
    name: Run frontend tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: preppilot-frontend/package-lock.json

      - name: Install dependencies
        working-directory: preppilot-frontend
        run: |
          npm ci

      - name: Run frontend tests
        working-directory: preppilot-frontend
        run: |
          npm test

      - name: Build frontend
        working-directory: preppilot-frontend
        env:
          VITE_API_BASE_URL: https://api.example.invalid
        run: |
          npm run build

  test-backend:
    name: Run backend tests
    runs-on: ubuntu-latest

    services: {}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install backend dependencies
        working-directory: preppilot-backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Run backend pytest
        working-directory: preppilot-backend
        run: |
          python -m pytest -q
